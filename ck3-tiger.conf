			}
			file = history/characters
		}
		NAND = { # Unclear, low: first_valid = { desc = { triggered_desc ... } desc = FALLBACK }: tiger counts the desc block as unconditional; untested whether the game skips it when none of its triggers match
			key = duplicate-field
			text = "multiple unconditional desc in one first_valid"

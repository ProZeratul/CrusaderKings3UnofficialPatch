				file = localization/english/event_localization/secret_events/secrets_events_l_english.yml
				file = localization/english/gui/schemewindow_l_english.yml
			}
		}
		NAND = { # Unclear, low: Concatenate('#low (', ...) in the secret tooltip; tiger warns about the ( inside a quoted argument
			key = localization
			text = "possible unterminated argument string"
			file = localization
		}
		NAND = { # Unclear, low: a literal @ in the Paradox account texts (does the engine render a lone @?)
			key = localization
			text = "expected icon name"
			file = localization
		}
		NAND = { # Unclear (medium if confirmed): create_character with two save_scope_as; if only the last applies, scope:local_character is unset in tgp_mandala_task_contract .1000 (empty portrait, a leftover peasant)
			key = duplicate-field
			text = "`save_scope_as` is redefined in a following line"
			file = events/dlc/tgp/tgp_mandala_task_contract_events.txt
		}
		NAND = { # Unclear, low: change_variable with two multiply operations (do both apply?)
			key = duplicate-field
			text = "`multiply` is redefined in a following line"
			file = events/dlc/ach/ach_maintenance_events.txt
		}
		NAND = { # Unclear, low: two top-level widget blocks with exclusive is_shown in natural disaster events (if only the last counts, the flood rain VFX never shows)
			key = duplicate-field
			text = "`widget` is redefined in a following line"
			file = events/situation_events/tgp_natural_disaster_events.txt
		}
		NAND = { # Unclear, low: history/characters typos in birth and death values (death = Yes or yrd, birth = ye; if not read as a death, three characters live past 100) and a female_empty beard
			OR = {
				key = missing-item
				key = validation
			}
			OR = {
				text = "death reason Yes not defined"
				text = "death reason yrd not defined"
				text = "expected `yes` or a date"

# The ck3-tiger.conf file is in standard Paradox script format.
# It should be placed in the top directory of your mod.

languages = {
	# This will check only english and german localizations
	#check = "english"
	#check = "german"

	# If you DON'T specify any check languages, you can instead say which ones to skip.
	#skip = "french"
	#skip = "spanish"

	# If you don't specify anything in languages, the validator will check all languages.
}

# Allows configuring what reports are printed by CK3-Tiger.
filter = {

    # Whether to report about problems in vanilla game files.
    # Setting this to 'yes' results in a LOT of spam.
    # Optional boolean value, defaults to no.
    show_vanilla = yes

    # Whether to report about problems in mods loaded via the load_mod sections.
    # Optional boolean value, defaults to no.
    show_loaded_mods = no

    # Contains rules for reports, using trigger syntax.
    # Only reports matching the trigger will be printed.
    # The root trigger is an AND block, just like any other trigger.
    trigger = {
        # For more information, there is a guide at: ck3-tiger/filter.md

        # In short, valid trigger keys are:
        # - always = yes/no
        # - NOT, AND, OR, NAND, NOR
        # - severity
        # - confidence
        # - key
        # - file
        # - text
        # - ignore_keys_in_files

 		# Only print warnings and errors
		severity >= Warning
		# Don't print reports that are likely false positives
		confidence >= Reasonable

		########################################################################
		# Intended: flagged correctly, but intended and correct in their context
		########################################################################

		NAND = { # Intended: treasury = 0 deliberately detects a newly-granted admin feature (exactly-zero treasury)
			key = logic
			text = "`treasury =` means exactly equal to that amount, which is usually not what you want"
			file = common/scripted_effects/00_administrative_effects.txt
		}
		NAND = { # Intended: overwriting the previous value seems correct here
			key = logic
			text = "setting value here will overwrite the previous calculations"
			OR = {
				file = common/decisions/dlc_decisions/mpo/mpo_decisions.txt
				file = common/script_values/07_ep3_values.txt
			}
		}
		NAND = { # Intended: pam_values.txt sets value = -100 after a zero base, which equals add
			key = logic
			text = "setting value here will overwrite the previous calculations"
			file = common/script_values/pam_values.txt
		}
		NAND = { # Intended: scope:ai_recipient is only used by this effect if it exsts
			key = strict-scopes
			text = "`diarch_overwrites_old_designated_heir_apply_opinions_effect` expects scope:ai_recipient to be set"
			file = common/character_interactions/06_ep3_interactions.txt
		}
		NAND = { # Intended: scope:owner is only used in the is_ai = no branch, but the story's AI behavior runs only for AI owners
			key = strict-scopes
			OR = {
				text = "`trickery_first_tier_trigger` expects scope:owner to be set"
				text = "`trickery_second_tier_trigger` expects scope:owner to be set"
				text = "`trickery_third_tier_trigger` expects scope:owner to be set"
				text = "`trickery_fourth_tier_trigger` expects scope:owner to be set"
			}
			file = common/story_cycles/tgp_story_cycle_mandala.txt
		}
		NAND = { # Intended: forge_the_jomsvikings_decision_tooltip_effect doesn't need scope:new_holy_order while building a tooltip
			key = strict-scopes
			text = "`forge_the_jomsvikings_decision_tooltip_effect` expects scope:new_holy_order to be set"
			file = common/decisions/dlc_decisions/fp_1/00_fp1_major_decisions.txt
		}
		NAND = { # Intended: scope is intentionally missing on some paths (not set there, or checked before it is set, e.g. on the first of repeated calls), and its existence is checked by exists
			key = strict-scopes
			OR = {
				text = "`hunt_activity_random_interest_participant_effect` expects scope:murder_target to be set"
				text = "`tournament_events_1250_favor_trigger` expects scope:favor_recipient_1 to be set"
				text = "`tournament_events_1250_favor_trigger` expects scope:favor_recipient_2 to be set"
				text = "`tournament_events_1250_favor_trigger` expects scope:favor_recipient_3 to be set"
				text = "`fi_2131_artifact_type_trigger` expects scope:artifact_1 to be set"
				text = "`linguist_bonus_culture_effect` expects scope:ling_cul_1_bonus to be set"
				text = "`linguist_bonus_culture_effect` expects scope:ling_cul_2_bonus to be set"
				text = "`linguist_bonus_culture_effect` expects scope:ling_cul_3_bonus to be set"
				text = "`linguist_bonus_culture_effect` expects scope:target_court_language to be set"
				text = "`laamp_base_contract_schemes_0034_distribute_province_modifiers_effect` expects scope:destination_2 to be set"
				text = "`ep1_flavor_2000_maa_scope_trigger` expects scope:maa_type_1 to be set"
				text = "`ep1_flavor_2000_maa_scope_trigger` expects scope:maa_type_2 to be set"
				text = "`ep1_flavor_councillor_scope_trigger` expects scope:councillor_1 to be set"
				text = "`ep1_flavor_2010_scapegoat_trigger` expects scope:scapegoat_1 to be set"
				text = "`divorce_holy_order_lease_effect` expects scope:barony_to_lease to be set"
				text = "`divorce_holy_order_lease_effect` expects scope:lease_order to be set"
				text = "`ec_chaplain_consider_doctrine_effect` expects scope:ec_chaplain_pick_value to be set"
			}
			OR = {
				file = common/scripted_effects/00_decisions_effects.txt
				file = common/scripted_effects/00_hunt_effects.txt
				file = events/activities/tournaments/tournament_events.txt
				file = events/dlc/ep1/ep1_fund_inspiration_events.txt
				file = events/scheme_events/laamp_base_contract_scheme_events.txt
				file = events/dlc/ep1/ep1_flavor_events.txt
				file = events/religion_events/religious_interaction_events.txt
				file = events/activities/ecumenical_council_activity/pam_ecumenical_council_events.txt
			}
		}
		NAND = { # Intended: on_vassal_change triggers ep3_laamps.0002 without scope:attacker for landless noble family heads, but is_valid_for_laampdom fails for AI ones and ep3_laamps.0004 requires var:deposed_primary_title, so it's never used
			key = strict-scopes
			text = "`create_landless_adventurer_title_effect` expects scope:attacker to be set"
			file = events/dlc/ep3/ep3_laamp_events.txt
		}
		NAND = { # Intended: these secret effects need these scopes only if the secret is of a certain type, which is checked correctly
			key = strict-scopes
			OR = {
				text = "`secret_exposed_owner_effects_effect` expects scope:victim to be set"
				text = "`secret_exposed_owner_effects_effect` expects scope:murderer to be set"
				text = "`secret_exposed_owner_effects_effect` expects scope:real_father to be set"
				text = "`secret_exposed_owner_effects_effect` expects scope:child to be set"
				text = "`secret_exposed_owner_effects_effect` expects scope:mother to be set"
				text = "`secret_exposed_notification_effects_effect` expects scope:victim to be set"
				text = "`secret_exposed_notification_effects_effect` expects scope:murderer to be set"
				text = "`secret_exposed_notification_effects_effect` expects scope:real_father to be set"
				text = "`secret_exposed_notification_effects_effect` expects scope:child to be set"
				text = "`secret_exposed_notification_effects_effect` expects scope:mother to be set"
				text = "`secret_exposed_notification_effect` expects scope:victim to be set"
			}
			file = common/scripted_effects/00_secret_effects.txt
		}
		NAND = { # Intended: lists don't have to exist in order to be checked
			key = strict-scopes
			OR = {
				text = "`yearly_1070_potential_soulmate_good_trigger` expects list potential_soulmate_list to exist"
				text = "`yearly_1070_potential_soulmate_great_trigger` expects list potential_soulmate_list to exist"
				text = "`demand_pastureland_adventurer_interaction_effect` expects list purchase_land_vassals_taken to exist"
				text = "`ep3_become_landed_transfer_effect` expects list purchase_land_vassals_taken to exist"
				text = "`ep3_landless_invasion_titles_taken_effect` expects list purchase_land_vassals_taken to exist"
				text = "`negotiate_settlement_interaction_effect` expects list purchase_land_vassals_taken to exist"
				text = "`purchase_land_interaction_effect` expects list purchase_land_vassals_taken to exist"
			}
			OR = {
				file = events/yearly_events/yearly_events_2.txt
				file = common/scripted_effects/07_dlc_ep3_scripted_effects.txt
			}
		}
		NAND = { # Intended: excluded_counties may not exist early in the event chain, but any_in_list then returns false safely
			key = strict-scopes
			text = "expects list excluded_counties to exist"
			file = events/lifestyles/governance_lifestyle/stewardship_domain_events.txt
		}
		NAND = { # Intended: Redefining accessory layouts should be fine, it's happening a lot especially between eras
			key = duplicate-item
			text = "accessory variation layout is redefined by another accessory variation layout"
			file = gfx/portraits/accessory_variations
		}
		NAND = { # Intended: scope:ignore_culture is optional, effect checks existence before use
			key = strict-scopes
			OR = {
				text = "`convert_to_administrative_from_feudalism_game_start_effect` expects scope:ignore_culture to be set"
				text = "`apply_historic_administrative_game_rule_effect` expects scope:ignore_culture to be set"
			}
		}
		NAND = { # Intended: They are checked just before the reported line
			key = strict-scopes
			OR = {
				text = "`playdate_2001_guest_of_interest_1_trigger` expects scope:guest_of_interest_1 to be set"
				text = "`playdate_2001_guest_of_interest_1_trigger` expects scope:guest_of_interest_2 to be set"
			}
			OR = {
				file = events/activities/playdate_activity/playdate_events.txt
				file = common/activities/activity_types/playdate.txt
			}
		}
		NAND = { # Intended: invalidate_activity = this in activity scope targets the activity itself, which is correct according to docs
			key = use-of-this
			text = "target `this` makes no sense here"
			OR = {
				file = common/scripted_effects/00_decisions_effects.txt
				file = common/scripted_effects/pam_investiture_council_effects.txt
			}
		}
		NAND = { # Intended: is_attracted_to_gender_of = this checks attraction to the own gender, and a forbidden tenet secret targets its owner
			key = use-of-this
			text = "target `this` makes no sense here"
			OR = {
				file = common/character_interactions/pam_interactions.txt
				file = common/script_values/pam_values.txt
				file = common/scripted_effects/pam_effects.txt
			}
		}
		NAND = { # Intended: scope:province_change_recipient absence is handled in change_province_metropolitan_effect
			key = strict-scopes
			text = "`display_movement_petition_recipient_acceptance_effect` expects scope:province_change_recipient to be set"
			OR = {
				file = events/decisions_events/tgp_decision_events.txt
				file = common/decisions/dlc_decisions/tgp/tgp_dynastic_cycle_decisions.txt
			}
		}
		NAND = { # Intended: scope:liege only used in else branch when scope:liege_temp not set
			key = strict-scopes
			text = "`ep3_governor_yearly_3100_messenger_trigger` expects scope:liege to be set"
		}
		NAND = { # Intended: easteregg_characters_list registration wrapped in `always = no` (never executes)
			key = scopes
			text = "`this` produces none but expected character"
			file = common/on_action/game_start.txt
		}
		NAND = { # Intended: mysterious_stranger_appeared is only checked for existence
			key = scopes
			text = "`scope:mysterious_stranger` produces character but expected bool"
			file = common/scripted_effects/04_dlc_ep2_tournament_effects.txt
		}
		NAND = { # Intended: attacker_wargoal_percentage = 1.5 (>1) makes the attacker never tick warscore from occupation; vanilla uses the same value for nomadic conquest CBs (00_nomadic_conquest.txt), so clamping it would change intended war pacing
			key = range
			text = "should be between 0 (inclusive) and 1 (inclusive)"
			OR = {
				file = common/casus_belli_types/00_nomadic_conquest.txt
				file = common/casus_belli_types/09_mpo_wars.txt
			}
		}
		NAND = { # Intended: The event will trigger at the same age that you got your land
			key = logic
			text = "`memory_age_years =` means exactly equal to that amount, which is usually not what you want"
			file = events/dlc/bp2/bp2_yearly_4.txt
		}
		NAND = { # Intended: petition_type_outcome_effect is a switch on var:petition_type; the Japanese ceremonial path (petition_liege.9020) only allows regent, appointment, wedding and privilege, whose effects use only scope:petition_vassal and scope:petition_liege; the bribe options that need scope:monk/knight require the flag saved with them
			key = strict-scopes
			OR = {
				text = "`petition_type_outcome_effect` expects"
				text = "`petition_skill_duel_effect` expects"
				text = "`petition_liege_0205_carry_out_effects_effect` expects"
			}
			file = events/activities/petition_liege_activity/petition_liege_events.txt
		}
		NAND = { # Intended: religion_interior character_view environments are unused for faiths, the faith window only uses the texture
			key = scopes
			text = "`is_character_window_main_character` is for character but scope seems to be faith"
			file = gfx/interface/illustrations/scripted_illustrations/ingame.txt
		}
		NAND = { # Intended: documented legacy forms that still work (pedestal, target_filter <source>_<filter>, capital_province, needs_confirmation, ai_potential)
			key = deprecated
			OR = {
				text = "is deprecated"
				text = "should use"
			}
			NOT = {
				OR = {
					file = "*fixpack*"
					file = "*unop*"
				}
			}
		}

		########################################################################
		# False positives: tiger false positives, with their F numbers
		########################################################################

		NAND = { # [F72] conqueror_chronicle has no properties
			key = field-missing
			text = "required field `properties` missing"
			file = events/dlc/ep3/ep3_laamp_decision_events.txt
		}
		NAND = { # [F1] these effects use root only to capture it as a scope if scope:actor is not set, or if scope:spouse_1 and scope:spouse_2 exist
			key = scopes
			OR = {
				text = "`break_grand_wedding_betrothal_effect` expects root to be any except none scope but root seems to be none"
				text = "`elope_success_effect` expects root to be any except none scope but root seems to be none"
				text = "`send_child_to_clergy_effect` expects root to be any except none scope but root seems to be none"
				text = "`send_child_to_holy_order_tooltip_effect` expects root to be any except none scope but root seems to be none"
				text = "`send_child_to_monastic_order_effect` expects root to be any except none scope but root seems to be none"
			}
			OR = {
				file = common/character_interactions/00_marriage_interactions.txt
				file = common/character_interactions/00_religious_interactions.txt
				file = common/scripted_effects/00_marriage_interaction_effects.txt
			}
		}
		NAND = { # [F69] accolade_to_mercenary_effect only uses root inside an `exists = root` check
			key = scopes
			text = "`accolade_to_mercenary_effect` expects root to be character but root seems to be none"
			file = common/character_interactions/00_accolade_interactions.txt
		}
		NAND = { # [F73] provisions = max_provisions is the check for full provisions
			key = logic
			text = "`provisions =` means exactly equal to that amount, which is usually not what you want"
			OR = {
				file = common/task_contracts/laamp_extra_contracts.txt
				file = events/dlc/ep3/ep3_interactions_events.txt
				file = events/dlc/ep3/ep3_laamp_decision_events.txt

		NAND = { # Unclear, low: artifact visuals without an untriggered asset or icon: some fall back with an entry whose trigger is NOR of the others, which tiger doesn't recognise (F84); the rest are keyed on building or unit gfx that cover every vanilla culture
			key = validation
			OR = {
				text = "needs at least one asset without a trigger"
				text = "needs one icon without a trigger"
			}
			OR = {
				file = common/artifacts/visuals/00_court_artifacts.txt
				file = common/artifacts/visuals/00_historical.txt

		NAND = { # Unclear, low: LandedTitle as an engine context name in situation effect tooltips (F85, or a slip for Title)
			key = datafunctions
			text = "unknown datafunction LandedTitle"
			file = localization/english/situations/situation_effects_l_english.yml
		}
		NAND = { # Unclear, low: a promote at the end of a function argument (Scheme.GetTargetCharacter) and named_scope.Char
			key = datafunctions
			OR = {
				text = "Char cannot follow a Character promote"

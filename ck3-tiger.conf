			file = events/dlc/ep1/ep1_fund_inspiration_events.txt
		}
		NAND = { # [F1] scope:target is documented polymorphic in create_artifact_wall_banner_effect (title, house, or dynasty)
			key = scopes
			OR = {
				text = "`scope:target` produces dynasty but expected dynasty house"
				text = "`scope:target` produces dynasty house but expected dynasty"
				text = "`scope:target` produces landed title but expected dynasty"
				text = "`scope:target` produces landed title but expected dynasty house"
			}
			file = common/scripted_effects/01_ep1_court_artifact_creation_effects.txt
		}
		NAND = { # Intended: artifact_should_use_gfx_type_trigger will fallback correctly if there is no scope:artifact
			key = strict-scopes
			text = "`artifact_should_use_gfx_type_trigger` expects scope:artifact to be set"
			file = common/scripted_triggers/00_artifact_triggers.txt
		}
		NAND = { # Intended: scope:activity is optional, these triggers fall back to the activity host and then the character's location
			key = strict-scopes
			OR = {
				text = "`pam_church_event_background_is_grand_western_pre_gothic_trigger` expects scope:activity to be set"
				text = "`pam_church_event_background_is_grand_western_trigger` expects scope:activity to be set"
				text = "`pam_church_event_background_is_grand_eastern_trigger` expects scope:activity to be set"
			}
		}
		NAND = { # Intended: scope is intentionally missing on some paths (not set there, or checked before it is set, e.g. on the first of repeated calls), and its existence is checked by exists
			key = strict-scopes
			OR = {
				text = "`hunt_activity_random_interest_participant_effect` expects scope:murder_target to be set"
				text = "`tournament_events_1250_favor_trigger` expects scope:favor_recipient_1 to be set"
				text = "`tournament_events_1250_favor_trigger` expects scope:favor_recipient_2 to be set"
				text = "`tournament_events_1250_favor_trigger` expects scope:favor_recipient_3 to be set"
				text = "`fi_2131_artifact_type_trigger` expects scope:artifact_1 to be set"
				text = "`linguist_bonus_culture_effect` expects scope:ling_cul_1_bonus to be set"
				text = "`linguist_bonus_culture_effect` expects scope:ling_cul_2_bonus to be set"
				text = "`linguist_bonus_culture_effect` expects scope:ling_cul_3_bonus to be set"
				text = "`linguist_bonus_culture_effect` expects scope:target_court_language to be set"
				text = "`laamp_base_contract_schemes_0034_distribute_province_modifiers_effect` expects scope:destination_2 to be set"
				text = "`ep1_flavor_2000_maa_scope_trigger` expects scope:maa_type_1 to be set"
				text = "`ep1_flavor_2000_maa_scope_trigger` expects scope:maa_type_2 to be set"
				text = "`ep1_flavor_councillor_scope_trigger` expects scope:councillor_1 to be set"
				text = "`ep1_flavor_2010_scapegoat_trigger` expects scope:scapegoat_1 to be set"
				text = "`divorce_holy_order_lease_effect` expects scope:barony_to_lease to be set"
				text = "`divorce_holy_order_lease_effect` expects scope:lease_order to be set"

			key = missing-item
			OR = {
				text = "portrait environment environment_event_councilchamber not defined in gfx/portraits/environments/"
				text = "portrait environment character_view_main not defined in gfx/portraits/environments/"
				text = "portrait environment character_view_spouse not defined in gfx/portraits/environments/"
			}
		}
		NAND = { # Ignore warnings about random inside send_interface_toast
			key = logic
			OR = {
				text = "running `random` inside `send_interface_toast` does not work right"
				text = "running `random_list` inside `send_interface_toast` does not work right"
				text = "running `random_list` inside `send_interface_message` does not work right"
			}
		}
		NAND = { # Pre-existing vanilla history quirks in e_goryeo/k_dzungaria, harmless
			key = history
			OR = {
				text = "korean_gim_silla_83 is not alive on 839.6.23"
				text = "uyghur0086 is not alive on 874.12.13"
				text = "d_gaeseong has no holder at 850.1.1"
				text = "e_kirghiz_khanate has no holder at 840.1.1"
			}
			OR = {
				file = history/titles/e_goryeo.txt
				file = history/titles/k_dzungaria.txt
			}
		}
		NAND = { # e_mongolia has no title history in vanilla, referenced as future liege
			key = missing-item
			text = "e_mongolia has no title history"
			file = history/titles/k_dzungaria.txt
		}
		NAND = { # Intended vanilla design: attacker_wargoal_percentage = 1.5 (>1) makes the attacker never tick warscore from occupation; vanilla uses the same value for nomadic conquest CBs (00_nomadic_conquest.txt), so clamping it would change intended war pacing
			key = range
			text = "should be between 0 (inclusive) and 1 (inclusive)"
			file = common/casus_belli_types/09_mpo_wars.txt
		}
		NAND = { # Intended vanilla design: The event will trigger at the same age that you got your land
			key = logic
			text = "`memory_age_years =` means exactly equal to that amount, which is usually not what you want"
			file = events/dlc/bp2/bp2_yearly_4.txt
		}
		NAND = { # religion_interior character_view environments are unused for faiths, the faith window only uses the texture
			key = scopes
			text = "`is_character_window_main_character` is for character but scope seems to be faith"
			file = gfx/interface/illustrations/scripted_illustrations/ingame.txt
		}
		NAND = { # Vanilla issue: unclear who the defender is when inciting a holy war before a target is picked
			key = strict-scopes
			text = "`are_holy_wars_disabled_by_struggle_conciliation_trigger` expects scope:defender to be set"
			file = common/character_interactions/pam_interactions.txt
		}
		NAND = { # Vanilla issue: tooltip only, the monk is created in the effect after it
			key = strict-scopes
			text = "`tribute_mission_1000_give_monk_effect` expects scope:new_monk to be set"
			file = events/dlc/tgp/tgp_tribute_mission_events.txt
		}
		NAND = { # Vanilla issue: undefined music cue, unclear which existing cue was intended
			key = missing-sound
			text = "music not defined in music/ or dlc/*/music/"
			file = events/dlc/pam/pam_interactions_events.txt
		}
	}
}


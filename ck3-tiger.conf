# Sometimes ck3-tiger makes a mistake in determining the scope types expected
# by a scripted trigger or effect. Its conclusions can be overridden here.
# Scope overrides can be ALL (to accept any scope) or a list separated by |,
# like character|province|landed_title
scope_override = {
	artifact_low_rarity_trigger = ALL
	artifact_medium_rarity_trigger = ALL
	artifact_high_rarity_trigger = ALL
	artifact_region_trigger = ALL
	standard_activity_base_cost = ALL # char, activity, none (interaction)
	scale_dynasty_prestige_by_era = character|dynasty
	activity_cost_scale_by_tier = character|activity
	standard_activity_base_cost_scale_value = character|activity # char, activity (Unop moved the activity root fix here in 1.21)
	activity_cost_scale_by_era = character|activity
	tribute_mission_is_available_eunuch_trigger = character|none
}


 #spymaster_task.0311.secret_lover.lustful:0 "\n\n[secret_holder.GetSheHe|U] has been engaged in carnality with [lover.GetTitledFirstName], running [secret_holder.GetHerHis] hands across the [SelectLocalization( IsLandlessAdventurer(lover), activity_adventure_owner, lover.GetTitleTierNamePossessive)] body, locking lips in all manner of ways... Oh, the scandal if this was to become public knowledge!"


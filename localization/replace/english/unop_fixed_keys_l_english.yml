 nick_the_fearless_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] soldiers say they've never seen [CharYouHerHim(CHARACTER)] flinch — neither to man, nor horse, nor missile. Most people believe them."

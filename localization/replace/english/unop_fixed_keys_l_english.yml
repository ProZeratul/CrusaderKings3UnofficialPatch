 # The tenet is available to all faiths, so don't refer to the Buddha and the Pure Land
 tenet_pure_land_desc: "Neither riches, study, nor high birth offer solace in this degenerate age. Only those who place their trust in sincere devotion may find rebirth in a blessed realm beyond suffering."
 # [spouse.GetShe|U] > [spouse.GetShe|U]
 coronation_events.6140.d_dislikes_spouse: "[spouse.GetSheHe|U] is still a wretched [spouse.GetWomanMan]..."
 # [ROOT.Char.GetChamber] > [ROOT.Char.Custom('GetChamber')]
 bp1_yearly.5704.desc:0 "[seduced_rival.GetFirstName] is in my [ROOT.Char.Custom('GetChamber')] once more, prattling on some nonsense about how I have wronged [seduced_rival.GetHerHim]. [seduced_rival.GetHerHis|U] eyes are aflame as [seduced_rival.GetSheHe] curses my name once again, and [seduced_rival.GetHerHis] choler only rises as I dismiss [seduced_rival.GetHerHis] anger with a scornful shake of the head.\n\nAs [seduced_rival.GetSheHe] continues to berate me even as I snipe back retorts in turn, I catch myself considering [seduced_rival.GetHerHis] eyes again. No sooner have I snapped out of that small reverie than I find my gaze drifting over to the curve of [seduced_rival.GetHerHis] jawline, so strikingly distended by rage. Unconsciously staring, I notice how [seduced_rival.GetHerHis] chest heaves invitingly as [seduced_rival.GetSheHe] continues [seduced_rival.GetHerHis] tirade, and-\n\nWhat #EMP have #!I got myself into?"
 # GetHerHim
 bp2_yearly.2015.desc: ""Will I never be free of that [bully.Custom2('InsultNoun', ROOT.Char)]?!" I lament, head hung in defeat after suffering further public ridicule from my bully, [bully.GetFirstName].\n\nAs hot tears stream down my face, I'm surprised by a soft touch on my shoulder. It's my friend, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. [ROOT.Char.Custom('GetSheHeOpposite')|U] is always there when I need [ROOT.Char.GetHerHim].\n\n"It's past time you stand up to that loathsome [bully.GetFirstNameNoTooltip]. I'd suggest starting a rumor about what [bully.GetSheHe] likes to do with [bully.GetHerHis] [bully.Custom('child_favorite_toy')] while alone in [bully.GetHerHis] chambers...""
 # Fix coma for the function
 legend_spread_events.8181.t: "The [killer.Custom2('InsultNoun', ROOT.Char)|U] Buried"
 # Fix missing Custom2 call
 clan_unity_proper_courtier_position.desc: "offered [beneficiary_of_nepotism.GetName] a position as a courtier, which is less than what [beneficiary_of_nepotism.GetHerHis] [beneficiary_of_nepotism.Custom2('RelationToMe', SCOPE.sC('advocate_of_nepotism'))] [advocate_of_nepotism.GetName] wanted"
 # Fix missing coma in Custom2 call
 title_event.0014.desc:0 "The recent formation of an independent [castille.GetBaseName], ruled by [castille_char.Custom2('MyCharacterIntroduction', leon_char)], has shattered my realm's claim to be the [asturias.GetBaseName].\n\nWith our eastern lands firmly lost to us, we are dominated by the inland area of [leon.GetBaseNameNoTier], and folk of every class and sect are letting the old title fall by the wayside."
 # GetHimHer > GetHerHim
 murder_save.1015.actual_weapon_artifact.desc:1 "$murder_save.1015.start_desc$ [this_artifact.GetName]. The color drains from [attempted_assassin.GetHerHis] face as [attempted_assassin.GetSheHe] realizes I am armed. It takes little effort to dispatch [attempted_assassin.GetHerHim] with the [SCOPE.Custom('ThisArtifactType')]."
 # Fix missing coma in Custom2 call
 prison.1001.anothers_secret.desc:1 ""You know something about [reveal_secret_owner.Custom2('MyCharacterIntroductionNoComma', SCOPE.sC('puppet_or_actor'))]," [puppet_or_actor.GetTitledFirstName] says. "Tell me everything, or else...""
 #HerHim > GetHerHim
 playdate.5010.desc: ""Get him! Push her into the wall! That's it!" [obnoxious_parent.GetFirstNamePossessive] voice booms out across the courtyard. [obnoxious_parent.GetSheHe|U] has posted up in the corner to watch [embarrassed_child.GetFirstName] play in the game of football, their bias towards the [embarrassed_child.Custom('GirlBoy')] clear to see.\n\nSuffice to say, [obnoxious_parent.GetFirstNameNoTooltip] is taking it a #EMP tad#! too seriously.\n\n"Hey! No pushing [embarrassed_child.GetHerHim], that's cheating!" [obnoxious_parent.GetFirstNamePossessiveNoTooltip] histrionics are really beginning to grate."


 # Look at my with > Look at me with
 mpo_nerge.0110.desc: "Despite our best attempts, the hunt has been a depressing sight. A couple of beasts have fallen, but not nearly as many as we had planned or hoped for.\n\nMy fellow riders look at me with despondent eyes, the shame as heavy on them as it is on me. How can we possibly show our faces in [ROOT.Char.GetCapitalLocation.GetName] after this?"
 # [ROOT.Char.Custom('VenomousCreature')] > [SCOPE.Custom('VenomousCreature')]
 murder_outcome.5001.creepy_crawly_known:0 "Even in the faint moonlight I can recognize the shape of a [SCOPE.Custom('VenomousCreature')]."
 # [ROOT.Char.Custom('VenomousCreatureAttack')] > [SCOPE.Custom('VenomousCreatureAttack')]
 murder_outcome.5001.creepy_crawly_end:0 "The [SCOPE.Custom('VenomousCreatureAttack')] barely stings at first, but soon my whole body is engulfed in searing pain. I try to call for help, but my voice is too weak as my limbs grow numb and my consciousness fades."
 # Reversed the scopes for the call of RelationToMeShort
 learning_theology.3054.c:0 "My [ROOT.Char.Custom2('RelationToMeShort', random_actor)|U] is a natural charmer."
 # [ROOT.Char.ReligiousHeadTitleName] > [ROOT.Char.GetFaith.ReligiousHeadName] & [ROOT.Char.ReligiousHeadTitle] > [ROOT.Char.GetFaith.ReligiousHeadName]
 bp1_yearly.9020.desc.hof:0 "what it would be like to lay with the [ROOT.Char.GetFaith.ReligiousHeadName]? All that time, the [ROOT.Char.GetFaith.ReligiousHeadName]'s fingers spend sifting over the holy books, why imagine how it must feel! Be my [ROOT.Char.GetFaith.ReligiousHeadName] and make me your [ROOT.Char.GetFaith.ReligiousText]!""
 # [ROOT.Char.ReligiousHeadTitleName] > [ROOT.Char.GetFaith.ReligiousHeadName]
 fp1_other_decisions.0022.desc:0 "It would seem that the [unlucky_guest.GetFaith.GetAdherentNamePlural] of the world have not taken my sacrifice of their false-[unlucky_guest.GetFaith.ReligiousHeadName] particularly well.\n\n"

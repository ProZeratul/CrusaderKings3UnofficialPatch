 # Add "My" before [ROOT.Char.GetTitleAsNameNoTooltip] (I find this prettier IMHO)
 hold_court.8100.desc.intro:1 "I am faced with [ward.GetFullNameNicknamedPossessive] sad eyes, which grow larger and more pitiful as [ward.GetHerHis] [ward.Custom2('RelationToMeShort', SCOPE.sC('advocate'))] [advocate.GetTitledFirstName] gently ushers [ward.GetHerHim] towards my throne. \n\n"My [ROOT.Char.GetTitleAsNameNoTooltip]", [advocate.GetSheHe] laments, "the [ward.Custom('GirlBoy')] has been at"

